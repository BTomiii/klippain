# Configuration for Eddy Current Probe (Virtual Endstop & Probing)
# This file should be included from your printer.cfg or a Klippain probe selection mechanism.

# To use this:
# 1. Ensure you have the LDC1612/probe_eddy_current Klipper extension installed (typically part of klipper-expander or similar).
# 2. In your Klippain _USER_VARIABLES.cfg (or a dedicated probe var file):
#    - Set `probe_type: "eddy"` (or similar identifier you choose for Klippain's probe selection logic).
#    - Configure the variables in the `[gcode_macro _USER_VARIABLES]` section below.
# 3. Klippain's main probe configuration (e.g., in `config/hardware/probes.cfg` or `printer.cfg`)
#    should then use these settings to populate the main `[probe]` section.
#    Example of how Klippain might set up the main [probe] section if "eddy" is selected:
#    [probe]
#    # Klippain common probe settings (lift_speed, travel_speed, samples etc.)
#    # ...
#    # For Eddy, the 'pin' is not used in the traditional sense.
#    # Klippain's [probe] section needs to be configured for sensor_type and sensor_name.
#    sensor_type: probe_eddy_current
#    sensor_name: btt_eddy_sensor # This refers to the [probe_eddy_current btt_eddy_sensor] defined below
#    x_offset: {{ printer["gcode_macro _USER_VARIABLES"].x_offset }}
#    y_offset: {{ printer["gcode_macro _USER_VARIABLES"].y_offset }}
#    # Klippain manages the final z_offset through its calibration routines.
#    # The z_offset in [probe_eddy_current btt_eddy_sensor] is the raw physical offset.

# 4. If using Eddy for Z-homing:
#    - In Klippain's _USER_VARIABLES, set `z_endstop_type: "probe"`.
#    - Klippain's homing macros will then use the probe for Z homing.

# 5. Custom Z-Offset Macros (Optional):
#    The original Eddy config includes a set of macros for live Z-offset adjustment
#    and saving/restoring this offset. Klippain has its own comprehensive Z-offset
#    management system. By default, this configuration will rely on Klippain's
#    system. If you wish to use the Eddy-specific Z-offset macros (e.g., for the
#    `nvm_offset` behavior), set `enable_eddy_custom_z_offset_macros: True`.
#    Be aware this might conflict or provide overlapping functionality with Klippain's
#    `SET_GCODE_OFFSET` and Z-Offset calibration tools. Exercise caution and understand
#    that enabling this effectively bypasses Klippain's calibrated Z-offset for homing.


[gcode_macro _USER_VARIABLES]
description: User-configurable settings for the Eddy Current Probe.
variable_mcu_name: "eddy"                         # Name for the Eddy MCU section (e.g., 'eddy' or 'toolboard_mcu')
variable_serial_path: ""                          # Serial path for Eddy USB. For Eddy Coil, this MCU section might not be needed if toolboard MCU is already defined.
variable_canbus_uuid: "32tsaf423qthet"            # Canbus UUID for Eddy CAN.
variable_canbus_interface: "can0"                 # Canbus Interface for Eddy CAN.
variable_is_usb_or_can_version: True              # Set to True for Eddy USB or Eddy CAN, False for Eddy Coil (affects temperature_probe section)
variable_ldc_sensor_type: "ldc1612"               # Sensor type for probe_eddy_current (e.g., ldc1612, ldc1614)
variable_i2c_mcu_name: "eddy"                     # MCU for I2C communication. For Eddy USB, usually same as mcu_name. For Coil, the toolboard MCU name.
variable_i2c_bus: "i2c0f"                         # I2C bus. For Eddy USB, typically 'i2c0f'. For Coil, check toolboard documentation (e.g., 'i2c1a').
variable_x_offset: 0                              # Probe X offset from nozzle
variable_y_offset: 21.42                          # Probe Y offset from nozzle
variable_raw_z_offset: 2.5                        # IMPORTANT: This is the initial *physical* Z offset of the probe.
                                                  # Klippain's Z_OFFSET_CALIBRATE will determine the precise value.
                                                  # If enable_eddy_custom_z_offset_macros is True, this raw_z_offset is used directly by the custom homing logic.
variable_mcu_temp_min: 10
variable_mcu_temp_max: 100
variable_probe_thermistor_pin: "gpio26"           # Only for Eddy USB/CAN: thermistor pin on the Eddy MCU.
variable_probe_thermistor_type: "Generic 3950"    # Only for Eddy USB/CAN: thermistor type.
variable_probe_temp_min: 10
variable_probe_temp_max: 100
variable_travel_speed_xy: 150                     # Default XY travel speed for calibration macro (mm/s)

variable_use_for_z_homing: True                   # Set to True if Eddy is your primary Z endstop/homing method.
                                                  # Requires Klippain's z_endstop_type = "probe".
variable_enable_eddy_custom_z_offset_macros: False # Set to True to enable Eddy's specific Z-offset macros.
                                                  # This may override or conflict with Klippain's Z-offset system. Use with caution.
gcode:
    # This macro is just a container for variables and should not be called directly.
    {% set dummy = 0 %} # Avoids "Macro _USER_VARIABLES not found" warnings if not used elsewhere

#--------------------------------------------------------------------
# MCU Definition for Eddy Probe (if it's a separate MCU like Eddy USB/CAN)
#--------------------------------------------------------------------
{% set eddy_mcu = printer["gcode_macro _USER_VARIABLES"].mcu_name %}
{% set eddy_serial = printer["gcode_macro _USER_VARIABLES"].serial_path %}
{% set eddy_canbus_uuid = printer["gcode_macro _USER_VARIABLES"].canbus_uuid %}
{% set eddy_canbus_interface = printer["gcode_macro _USER_VARIABLES"].canbus_interface %}

# Only define the MCU if a serial path is provided (relevant for Eddy USB)
# For Eddy Coil on a toolboard, the toolboard MCU should be defined elsewhere.
{% if eddy_serial and eddy_serial|lower != "none" and eddy_serial|trim != "" %}
[mcu {{ eddy_mcu }}]
serial: {{ eddy_serial }}
restart_method: command
{% endif %}

{% if eddy_canbus_uuid and eddy_canbus_uuid|lower != "none" and eddy_canbus_uuid|trim != "" %}
[mcu {{ eddy_mcu }}]
canbus_uuid: {{ eddy_canbus_uuid }}
canbus_interface: {{ eddy_canbus_interface }}
{% endif %}



#--------------------------------------------------------------------
# Temperature Sensors for Eddy Probe
#--------------------------------------------------------------------
# MCU temperature sensor for the Eddy's controller (or toolboard)
[temperature_sensor eddy_mcu_temp]
sensor_type: temperature_mcu
sensor_mcu: {{ printer["gcode_macro _USER_VARIABLES"].i2c_mcu_name }} # Use i2c_mcu_name as it's the relevant one for the probe's components
min_temp: {{ printer["gcode_macro _USER_VARIABLES"].mcu_temp_min }}
max_temp: {{ printer["gcode_macro _USER_VARIABLES"].mcu_temp_max }}

# External thermistor on the Eddy USB/CAN board
{% if printer["gcode_macro _USER_VARIABLES"].is_usb_or_can_version %}
[temperature_probe eddy_thermistor]
sensor_type: {{ printer["gcode_macro _USER_VARIABLES"].probe_thermistor_type }}
sensor_pin: {{ eddy_mcu }}:{{ printer["gcode_macro _USER_VARIABLES"].probe_thermistor_pin }} # Assumes thermistor is on the 'eddy_mcu'
min_temp: {{ printer["gcode_macro _USER_VARIABLES"].probe_temp_min }}
max_temp: {{ printer["gcode_macro _USER_VARIABLES"].probe_temp_max }}
{% endif %}


#--------------------------------------------------------------------
# Eddy Current Sensor Definition
# This section defines the specifics of the Eddy sensor.
# Klippain's main [probe] section will reference this using 'sensor_name'.
#--------------------------------------------------------------------
[probe_eddy_current btt_eddy_sensor]
sensor_type: {{ printer["gcode_macro _USER_VARIABLES"].ldc_sensor_type }}
z_offset: {{ printer["gcode_macro _USER_VARIABLES"].raw_z_offset }} # Physical offset. Klippain's calibration refines this for its [probe] section.
                                                                     # If enable_eddy_custom_z_offset_macros is True, this raw_z_offset is used directly by custom homing.
i2c_mcu: {{ printer["gcode_macro _USER_VARIABLES"].i2c_mcu_name }}
i2c_bus: {{ printer["gcode_macro _USER_VARIABLES"].i2c_bus }}
# x_offset and y_offset are applied in Klippain's main [probe] section.
# Klippain will also manage speed, samples, lift_speed etc. in the main [probe] section.

#--------------------------------------------------------------------
# Eddy-Specific Macros & Optional Overrides
#--------------------------------------------------------------------

# Auto calibration macro for probe_eddy_current
[gcode_macro PROBE_EDDY_CURRENT_CALIBRATE_AUTO]
description: Automates frequency mapping for the Eddy current probe.
gcode:
    {% set th = printer.toolhead %}
    {% set x_max = printer.configfile.settings.stepper_x.position_max %}
    {% set y_max = printer.configfile.settings.stepper_y.position_max %}
    {% set z_max = printer.configfile.settings.stepper_z.position_max %}
    {% set travel_speed_xy = printer["gcode_macro _USER_VARIABLES"].travel_speed_xy * 60 %}

    BED_MESH_CLEAR
    STATUS_MESHING # If Klippain Status Macros are used

    {% if 'x' not in th.homed_axes or 'y' not in th.homed_axes %}
      STATUS_HOMING # If Klippain Status Macros are used
      G28 X Y
    {% endif %}
    G90
    G1 X{ x_max / 2 } Y{ y_max / 2 } F{ travel_speed_xy }

    {% if 'z' not in th.homed_axes %}
        # WARNING: If Z is not homed, setting kinematic position is risky.
        # Ensure 'force_move' is enabled in [force_move] or home Z manually first.
        # Incorrect Z max can lead to crashes. Proceed with caution.
        M118 Z axis not homed. Setting kinematic Z={{ z_max - 1 }}. Manually lower if needed.
        SET_KINEMATIC_POSITION Z={{ z_max - 1 }}
    {% endif %}

    PROBE_EDDY_CURRENT_CALIBRATE {rawparams}
    STATUS_READY # If Klippain Status Macros are used


# Conditional sections for Eddy's custom Z-Offset system.
# Only enable if `enable_eddy_custom_z_offset_macros` is True.
{% if printer["gcode_macro _USER_VARIABLES"].enable_eddy_custom_z_offset_macros %}

    # Save variables for custom Z offset persistence
    [save_variables]
    filename: ~/printer_data/config/variables_eddy_offset.cfg # Separate from Klippain's main z_offset variables

    # Force move, useful for initial setup if Z cannot be homed
    # Ensure this is enabled if PROBE_EDDY_CURRENT_CALIBRATE_AUTO might run without Z homed.
    [force_move]
    enable_force_move: True

    # Restore custom probe offset at startup
    [delayed_gcode _RESTORE_EDDY_PROBE_OFFSET_STARTUP]
    initial_duration: 1.0
    gcode:
        {% set svv = printer.save_variables.variables %}
        {% if not printer["gcode_macro SET_GCODE_OFFSET_EDDY"].restored %}
            SET_GCODE_VARIABLE MACRO=SET_GCODE_OFFSET_EDDY VARIABLE=runtime_offset VALUE={ svv.nvm_offset|default(0) }
            SET_GCODE_VARIABLE MACRO=SET_GCODE_OFFSET_EDDY VARIABLE=restored VALUE=True
            M118 Eddy custom Z-offset restored: { svv.nvm_offset|default(0) }mm
        {% endif %}

    # Macro to apply G-Code offset after probing, using Eddy's custom offset
    # This is called by the custom G28 macro below if Z is homed.
    [gcode_macro _SET_Z_FROM_PROBE_EDDY]
    description: Sets G-code Z offset based on probe result and Eddy's custom runtime_offset.
    gcode:
        {% set probe_settings = printer.configfile.settings["probe_eddy_current btt_eddy_sensor"] %}
        {% set safe_z_home_settings = printer.configfile.settings.safe_z_home | default({}) %}

        {% set eddy_z_offset_value = printer["gcode_macro SET_GCODE_OFFSET_EDDY"].runtime_offset %}
        
        # Calculate the G-code Z position to set.
        # This means nozzle is at Z=0 when it's at the trigger point of the probe,
        # adjusted by the probe's physical z_offset (from [probe_eddy_current]) and the custom runtime_offset.
        {% set target_z = printer.probe.last_z_result - probe_settings.z_offset + eddy_z_offset_value %}

        M118 Applying Eddy Z Offset: last_probe_z={{ "%.4f" % printer.probe.last_z_result }}, raw_probe_offset={{ "%.4f" % probe_settings.z_offset }}, eddy_runtime_offset={{ "%.4f" % eddy_z_offset_value }}
        M118 Setting GCode Z to: {{ "%.4f" % target_z }}

        SET_GCODE_OFFSET Z={target_z} # This sets the current Z position in the coordinate system
        
        G90
        {% if safe_z_home_settings and safe_z_home_settings.z_hop %}
            G1 Z{ [target_z + safe_z_home_settings.z_hop, printer.toolhead.axis_maximum.z]|min } F{ (safe_z_home_settings.z_hop_speed|default(15)) * 60 }
        {% else %}
            G1 Z{ [target_z + 5, printer.toolhead.axis_maximum.z]|min } F{ 15*60 } # Default hop if safe_z_home not fully defined
        {% endif %}

    # Override Klippain's Z_OFFSET_APPLY_PROBE to save Eddy's custom offset
    # Klippain's Z_OFFSET_APPLY_PROBE typically saves to printer.save_variables.variables.z_offset
    [gcode_macro Z_OFFSET_APPLY_PROBE]
    rename_existing: Z_OFFSET_APPLY_PROBE_KLIPPAIN_BASE
    gcode:
        SAVE_VARIABLE VARIABLE=nvm_offset VALUE={ printer["gcode_macro SET_GCODE_OFFSET_EDDY"].runtime_offset }
        M118 Eddy custom Z-offset (nvm_offset) saved: { printer["gcode_macro SET_GCODE_OFFSET_EDDY"].runtime_offset }
        # Optionally call Klippain's original if needed, but this system is meant to replace it for this specific offset.
        # Z_OFFSET_APPLY_PROBE_KLIPPAIN_BASE

    # Override Klippain's SET_GCODE_OFFSET for Eddy's live Z adjustment
    # This is a complex override. Ensure you understand the implications.
    # Klippain's SET_GCODE_OFFSET is often used by its own Z calibration tools.
    # IMPORTANT: Verify the `rename_existing` target. Klippain might use a different base name
    # (e.g., _SET_GCODE_OFFSET_BASE) if it renames the stock Klipper SET_GCODE_OFFSET.
    [gcode_macro SET_GCODE_OFFSET_EDDY]
    rename_existing: SET_GCODE_OFFSET_KLIPPAIN_BASE
    variable_restored: False
    variable_runtime_offset: 0.0
    gcode:
        {% set current_offset = printer["gcode_macro SET_GCODE_OFFSET_EDDY"].runtime_offset %}
        
        {% if params.Z_ADJUST %}
            {% set new_offset = current_offset + params.Z_ADJUST|float %}
            SET_GCODE_VARIABLE MACRO=SET_GCODE_OFFSET_EDDY VARIABLE=runtime_offset VALUE={ new_offset }
            M118 Eddy runtime_offset adjusted by {{ params.Z_ADJUST|float }} to {{ new_offset }}
            # Apply the change immediately to the current G-code offset
            SET_GCODE_OFFSET_KLIPPAIN_BASE Z_ADJUST={params.Z_ADJUST|float}
        {% elif params.Z is defined and params.Z|string == "0" %}
            # This implements the "SET_GCODE_OFFSET Z=0" resets the runtime_offset behavior
            M118 Eddy runtime_offset reset due to Z=0. Previous value: {{ current_offset }}
            # Adjust the actual G-code offset back by the old runtime_offset
            SET_GCODE_OFFSET_KLIPPAIN_BASE Z_ADJUST={ -current_offset }
            SET_GCODE_VARIABLE MACRO=SET_GCODE_OFFSET_EDDY VARIABLE=runtime_offset VALUE=0.0
            # Pass through other parameters, excluding the Z=0 we processed
            {% set processed_params = [] %}
            {% for k, v in params.items() %}
                {% if k|upper != 'Z' %}
                    {% set _dummy = processed_params.append(k + "=" + v|string) %}
                {% endif %}
            {% endfor %}
            {% if processed_params %}
                SET_GCODE_OFFSET_KLIPPAIN_BASE { processed_params|join(' ') }
            {% else %}
                SET_GCODE_OFFSET_KLIPPAIN_BASE # Call with no params if only Z=0 was passed
            {% endif %}
        {% else %}
            # Pass through to Klippain's original SET_GCODE_OFFSET
            SET_GCODE_OFFSET_KLIPPAIN_BASE {rawparams}
        {% endif %}

    # Custom G28 for Eddy if using its Z-Homing and custom Z-Offset system
    # This will override Klippain's G28.
    {% if printer["gcode_macro _USER_VARIABLES"].use_for_z_homing %}
    [gcode_macro G28]
    rename_existing: G28_KLIPPAIN_BASE # This captures Klippain's G28
    gcode:
        M118 Eddy G28: Using custom G28 for Eddy Z-homing and offset.
        # Call Klippain's G28 logic first
        G28_KLIPPAIN_BASE {rawparams}

        # If Z was homed (or all axes), apply Eddy's specific Z offset logic
        {% if not rawparams or 'Z' in rawparams|upper %}
            _SET_Z_FROM_PROBE_EDDY
            M118 Eddy G28: _SET_Z_FROM_PROBE_EDDY executed.
        {% endif %}
        STATUS_READY # If Klippain Status Macros are used
    {% endif %}

{% endif %} # End of enable_eddy_custom_z_offset_macros

#--------------------------------------------------------------------
# Notes on Klippain Integration:
#
# 1. Main [probe] section:
#    Klippain likely has a central `[probe]` section (e.g., in `config/hardware/probes.cfg`).
#    This section needs to be configured to use `sensor_type: probe_eddy_current` and
#    `sensor_name: btt_eddy_sensor` when Eddy is selected. The `x_offset`, `y_offset`,
#    `lift_speed`, `samples`, etc., should be set there.
#    The `z_offset` in Klippain's `[probe]` section will be managed by Klippain's
#    Z_OFFSET_CALIBRATE / PROBE_CALIBRATE routines. The `raw_z_offset` in this file
#    is an initial physical estimate for `[probe_eddy_current btt_eddy_sensor]`.
#
# 2. Z-Homing:
#    If `use_for_z_homing: True` and Klippain's `_USER_VARIABLES.z_endstop_type` is set to `"probe"`,
#    Klippain's `_HOME_Z` macro should automatically use the `PROBE` command.
#    If `enable_eddy_custom_z_offset_macros: False` (default), Klippain's standard Z offset
#    application after homing will apply, using the `z_offset` from the main `[probe]` section.
#    If `enable_eddy_custom_z_offset_macros: True`, the custom G28 above will call
#    `_SET_Z_FROM_PROBE_EDDY` to apply Eddy's specific offset logic, using the `raw_z_offset`
#    from `[probe_eddy_current btt_eddy_sensor]` and the `runtime_offset`.
#
# 3. Bed Mesh:
#    The original config had a `[bed_mesh]` section. Klippain typically manages this in
#    `config/calibration/bed_mesh.cfg`. You should configure your mesh parameters there.
#    Klippain's `[probe]` section manages `horizontal_move_z`.
#    The `BED_MESH_CALIBRATE METHOD=rapid_scan` can be achieved by calling Klippain's
#    `BED_MESH_CALIBRATE METHOD=rapid_scan` directly if `probe_eddy_current` supports it.
#
# 4. KNOMI:
#    Klippain has its own KNOMI integration. If you use KNOMI, ensure there are no
#    conflicting macro renames or status variable settings. The KNOMI-specific lines
#    from the original Eddy config are omitted here, assuming Klippain handles KNOMI.
#
# 5. Review and Test:
#    Given the complexity of interactions, especially with the optional custom Z-offset macros,
#    thoroughly test homing, probing, Z-offset adjustments, and bed leveling.
#    Start with `enable_eddy_custom_z_offset_macros: False` to rely on Klippain's
#    more standard Z-offset handling. If you enable the custom macros, carefully verify
#    the `rename_existing` targets for `Z_OFFSET_APPLY_PROBE`, `SET_GCODE_OFFSET_EDDY`, and `G28`.
#--------------------------------------------------------------------


# Beacon probe definition also include the probe management macro directly from here
# This line assumes you have a generic_probe.cfg at the specified relative path.
# Adjust or remove if your Klippain setup handles probe inclusion differently.
[include ../../../macros/base/probing/generic_probe.cfg]