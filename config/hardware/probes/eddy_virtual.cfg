# Common Configuration for Eddy Current Probe (Virtual Endstop & Probing)
# This file is INCLUDED by eddy_CAN_MCU.cfg, eddy_USB_MCU.cfg, or eddy_COIL_Toolboard.cfg
# The _EDDY_PROBE_VARIABLES macro (defined in the including file) is used by G-CODE MACROS below at RUNTIME.
# For the hardware sections directly below ([temperature_sensor], [probe_eddy_current]),
# you must MANUALLY set the values based on your _EDDY_PROBE_VARIABLES for reliability.

# Klippain Integration Notes:
# - Klippain's main [probe] section should use these settings:
#   sensor_type: probe_eddy_current
#   sensor_name: btt_eddy_sensor # This refers to the [probe_eddy_current] below
#   x_offset: {{ printer["gcode_macro _EDDY_PROBE_VARIABLES"].x_offset }} # Klippain can template this
#   y_offset: {{ printer["gcode_macro _EDDY_PROBE_VARIABLES"].y_offset }} # Klippain can template this

#--------------------------------------------------------------------
# Temperature Sensor for the I2C Controller MCU (e.g., 'eddy' MCU or toolboard MCU)
#--------------------------------------------------------------------
[temperature_sensor eddy_mcu_temp]
sensor_type: temperature_mcu
# MANUALLY SET 'sensor_mcu' to match 'i2c_mcu_name' from your active _EDDY_PROBE_VARIABLES
# (e.g., "eddy" for CAN/USB versions, or your toolboard MCU name for COIL version)
sensor_mcu: eddy # Example for CAN/USB. For COIL, use your toolboard MCU name.
# MANUALLY SET min/max_temp to match 'mcu_temp_min/max' from your _EDDY_PROBE_VARIABLES
min_temp: 10
max_temp: 100

#--------------------------------------------------------------------
# Eddy Current Sensor Definition
#--------------------------------------------------------------------
[probe_eddy_current btt_eddy_sensor] # This is the sensor_name Klippain's [probe] will use
# MANUALLY SET values below based on your active _EDDY_PROBE_VARIABLES
sensor_type: ldc1612         # E.g., "ldc1612" (from _EDDY_PROBE_VARIABLES.ldc_sensor_type)
z_offset: 2.5                # E.g., 2.5 (from _EDDY_PROBE_VARIABLES.raw_z_offset) - Klippain calibrates final offset
# MANUALLY SET 'i2c_mcu' to match 'i2c_mcu_name' from your active _EDDY_PROBE_VARIABLES
i2c_mcu: eddy                # Example for CAN/USB. For COIL, use your toolboard MCU name.
# MANUALLY SET 'i2c_bus' to match 'i2c_bus' from your active _EDDY_PROBE_VARIABLES
i2c_bus: i2c0f               # Example for CAN/USB. For COIL, use your toolboard I2C bus.

#--------------------------------------------------------------------
# Standard supporting sections
#--------------------------------------------------------------------
[save_variables]
filename: ~/printer_data/config/variables_eddy_offset.cfg

[force_move]
enable_force_move: True

[delayed_gcode _RESTORE_EDDY_PROBE_OFFSET_STARTUP]
initial_duration: 1.0
gcode:
    {% if "_EDDY_PROBE_VARIABLES" in printer.gcode_macro and printer["gcode_macro _EDDY_PROBE_VARIABLES"].enable_eddy_custom_z_offset_macros %}
        M118 _RESTORE_EDDY_PROBE_OFFSET_STARTUP: Custom Z-offset system enabled. Attempting restore.
        {% set svv = printer.save_variables.variables %}
        {% if "SET_GCODE_OFFSET_EDDY" in printer.gcode_macro %}
            {% if "nvm_offset" in svv and not printer["gcode_macro SET_GCODE_OFFSET_EDDY"].restored %}
                SET_GCODE_VARIABLE MACRO=SET_GCODE_OFFSET_EDDY VARIABLE=runtime_offset VALUE={ svv.nvm_offset }
                SET_GCODE_VARIABLE MACRO=SET_GCODE_OFFSET_EDDY VARIABLE=restored VALUE=True
                M118 Eddy custom Z-offset restored from nvm_offset: { svv.nvm_offset }mm
            {% elif "nvm_offset" not in svv and not printer["gcode_macro SET_GCODE_OFFSET_EDDY"].restored %}
                SET_GCODE_VARIABLE MACRO=SET_GCODE_OFFSET_EDDY VARIABLE=runtime_offset VALUE=0.0
                SET_GCODE_VARIABLE MACRO=SET_GCODE_OFFSET_EDDY VARIABLE=restored VALUE=True
                M118 Eddy custom Z-offset: nvm_offset not found, runtime_offset initialized to 0.0mm.
            {% elif printer["gcode_macro SET_GCODE_OFFSET_EDDY"].restored %}
                M118 Eddy custom Z-offset already marked as restored.
            {% endif %}
        {% else %}
            M118 _RESTORE_EDDY_PROBE_OFFSET_STARTUP: Target macro SET_GCODE_OFFSET_EDDY not found. Cannot restore.
        {% endif %}
    {% else %}
        M118 _RESTORE_EDDY_PROBE_OFFSET_STARTUP: Custom Z-offset system disabled or _EDDY_PROBE_VARIABLES not found. Skipping restore.
    {% endif %}

#--------------------------------------------------------------------
# Eddy-Specific Macros
#--------------------------------------------------------------------
[gcode_macro PROBE_EDDY_CURRENT_CALIBRATE_AUTO]
description: Automates frequency mapping for the Eddy current probe.
gcode:
    {% set probe_vars = printer["gcode_macro _EDDY_PROBE_VARIABLES"] %}
    {% set th = printer.toolhead %}
    {% set x_max = printer.configfile.settings.stepper_x.position_max %}
    {% set y_max = printer.configfile.settings.stepper_y.position_max %}
    {% set z_max = printer.configfile.settings.stepper_z.position_max %}
    {% set travel_speed_xy = probe_vars.travel_speed_xy * 60 %}
    BED_MESH_CLEAR
    STATUS_MESHING
    {% if 'x' not in th.homed_axes or 'y' not in th.homed_axes %}
      STATUS_HOMING
      G28 X Y
    {% endif %}
    G90
    G1 X{ x_max / 2 } Y{ y_max / 2 } F{ travel_speed_xy }
    {% if 'z' not in th.homed_axes %}
        M118 WARNING: Z axis not homed for PROBE_EDDY_CURRENT_CALIBRATE_AUTO.
        M118 Setting kinematic Z position to {{ z_max - 1 }}. Ensure 'force_move: True'.
        M118 MANUALLY VERIFY AND LOWER NOZZLE BEFORE PROCEEDING.
        SET_KINEMATIC_POSITION Z={{ z_max - 1 }}
    {% endif %}
    PROBE_EDDY_CURRENT_CALIBRATE {rawparams}
    STATUS_READY

# --- Custom Z-Offset Macros - Defined Unconditionally, Gated Internally ---

[gcode_macro _SET_Z_FROM_PROBE_EDDY]
description: Sets G-code Z offset based on probe result and Eddy's custom runtime_offset (if enabled).
gcode:
    {% if "_EDDY_PROBE_VARIABLES" in printer.gcode_macro and printer["gcode_macro _EDDY_PROBE_VARIABLES"].enable_eddy_custom_z_offset_macros %}
        {% if "SET_GCODE_OFFSET_EDDY" not in printer.gcode_macro %}
            M118 ERROR in _SET_Z_FROM_PROBE_EDDY: SET_GCODE_OFFSET_EDDY macro is missing.
            {action_raise_error("SET_GCODE_OFFSET_EDDY macro missing for custom Z offset")}
        {% endif %}
        {% set probe_settings = printer.configfile.settings["probe_eddy_current btt_eddy_sensor"] %}
        {% set safe_z_home_settings = printer.configfile.settings.safe_z_home | default({}) %}
        {% set eddy_z_offset_value = printer["gcode_macro SET_GCODE_OFFSET_EDDY"].runtime_offset %}
        {% set target_z = printer.probe.last_z_result - probe_settings.z_offset + eddy_z_offset_value %}

        M118 Applying Eddy Z Offset: last_probe_z={{ "%.4f" % printer.probe.last_z_result }}, raw_probe_offset={{ "%.4f" % probe_settings.z_offset }}, eddy_runtime_offset={{ "%.4f" % eddy_z_offset_value }}
        M118 Setting GCode Z to: {{ "%.4f" % target_z }}
        SET_GCODE_OFFSET Z={target_z}
        G90
        {% if safe_z_home_settings and safe_z_home_settings.z_hop %}
            G1 Z{ [target_z + safe_z_home_settings.z_hop, printer.toolhead.axis_maximum.z]|min } F{ (safe_z_home_settings.z_hop_speed|default(15)) * 60 }
        {% else %}
            G1 Z{ [target_z + 5, printer.toolhead.axis_maximum.z]|min } F{ 15*60 }
        {% endif %}
    {% else %}
        M118 _SET_Z_FROM_PROBE_EDDY: Custom Z-offset system not enabled. Skipping.
    {% endif %}

[gcode_macro Z_OFFSET_APPLY_PROBE]
rename_existing: Z_OFFSET_APPLY_PROBE_KLIPPAIN_BASE
gcode:
    {% if "_EDDY_PROBE_VARIABLES" in printer.gcode_macro and printer["gcode_macro _EDDY_PROBE_VARIABLES"].enable_eddy_custom_z_offset_macros %}
        {% if "SET_GCODE_OFFSET_EDDY" not in printer.gcode_macro %}
            M118 ERROR in Z_OFFSET_APPLY_PROBE: SET_GCODE_OFFSET_EDDY macro is missing.
            Z_OFFSET_APPLY_PROBE_KLIPPAIN_BASE {rawparams} ; Fallback to Klippain base
            {action_raise_error("SET_GCODE_OFFSET_EDDY macro missing for custom Z offset")}
        {% endif %}
        SAVE_VARIABLE VARIABLE=nvm_offset VALUE={ printer["gcode_macro SET_GCODE_OFFSET_EDDY"].runtime_offset }
        M118 Eddy custom Z-offset (nvm_offset) saved: { printer["gcode_macro SET_GCODE_OFFSET_EDDY"].runtime_offset }
    {% else %}
        M118 Z_OFFSET_APPLY_PROBE: Custom Z-offset system not enabled. Calling Klippain base.
        Z_OFFSET_APPLY_PROBE_KLIPPAIN_BASE {rawparams}
    {% endif %}

[gcode_macro SET_GCODE_OFFSET_EDDY]
rename_existing: SET_GCODE_OFFSET_KLIPPAIN_BASE ; Verify Klippain's base macro name
variable_restored: False
variable_runtime_offset: 0.0
gcode:
    {% if "_EDDY_PROBE_VARIABLES" in printer.gcode_macro and printer["gcode_macro _EDDY_PROBE_VARIABLES"].enable_eddy_custom_z_offset_macros %}
        {% set current_offset = self.runtime_offset %}
        {% if params.Z_ADJUST %}
            {% set new_offset = current_offset + params.Z_ADJUST|float %}
            SET_GCODE_VARIABLE MACRO=SET_GCODE_OFFSET_EDDY VARIABLE=runtime_offset VALUE={ new_offset }
            M118 Eddy runtime_offset adjusted by {{ params.Z_ADJUST|float }} to {{ "%.4f" % new_offset }}
            SET_GCODE_OFFSET_KLIPPAIN_BASE Z_ADJUST={params.Z_ADJUST|float}
        {% elif params.Z is defined and params.Z|string == "0" %}
            M118 Eddy runtime_offset reset due to Z=0. Previous value: {{ "%.4f" % current_offset }}
            SET_GCODE_OFFSET_KLIPPAIN_BASE Z_ADJUST={ -current_offset }
            SET_GCODE_VARIABLE MACRO=SET_GCODE_OFFSET_EDDY VARIABLE=runtime_offset VALUE=0.0
            {% set processed_params = [] %}
            {% for k, v_param in params.items() %}{% if k|upper != 'Z' %}{% set _dummy = processed_params.append(k + "=" + v_param|string) %}{% endif %}{% endfor %}
            {% if processed_params %}SET_GCODE_OFFSET_KLIPPAIN_BASE { processed_params|join(' ') }{% else %}SET_GCODE_OFFSET_KLIPPAIN_BASE{% endif %}
        {% else %}
            SET_GCODE_OFFSET_KLIPPAIN_BASE {rawparams}
        {% endif %}
    {% else %}
        M118 SET_GCODE_OFFSET_EDDY: Custom Z-offset system not enabled. Passing to Klippain base.
        SET_GCODE_OFFSET_KLIPPAIN_BASE {rawparams}
    {% endif %}

[gcode_macro G28]
rename_existing: G28_KLIPPAIN_BASE
gcode:
    G28_KLIPPAIN_BASE {rawparams}

    {% if "_EDDY_PROBE_VARIABLES" in printer.gcode_macro and printer["gcode_macro _EDDY_PROBE_VARIABLES"].enable_eddy_custom_z_offset_macros and printer["gcode_macro _EDDY_PROBE_VARIABLES"].use_for_z_homing %}
        {% if not rawparams or 'Z' in rawparams|upper %}
            M118 G28: Custom Eddy Z-homing logic triggered.
            _SET_Z_FROM_PROBE_EDDY
            M118 Eddy G28: _SET_Z_FROM_PROBE_EDDY executed.
        {% endif %}
    {% elif "_EDDY_PROBE_VARIABLES" in printer.gcode_macro and printer["gcode_macro _EDDY_PROBE_VARIABLES"].use_for_z_homing %}
        M118 G28: Eddy is Z probe, but custom Z-offset macros disabled. Klippain's Z offset logic applies.
    {% endif %}
    STATUS_READY

