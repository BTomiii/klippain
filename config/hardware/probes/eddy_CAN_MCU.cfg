# Configuration for CAN-bus Eddy Probe

# 1. Define the CAN MCU for the Eddy Probe
[mcu eddy] # <<< MCU name is now 'eddy'
canbus_uuid: your_actual_canbus_uuid_here # E.g., 32tsaf423qthet
canbus_interface: can0
# restart_method: command

# 2. Define the Eddy's onboard thermistor (if applicable for this Eddy version)
#    Values here are examples for a BTT Eddy. ADJUST TO YOUR PROBE.
[temperature_probe eddy_thermistor]
sensor_type: Generic 3950   # E.g., "Generic 3950"
sensor_pin: eddy:gpio26     # Uses the MCU name 'eddy' defined above and the pin
min_temp: 10
max_temp: 100

# 3. Define variables for this Eddy CAN probe setup
[gcode_macro _EDDY_PROBE_VARIABLES]
description: Variables for CAN Eddy Probe configuration.
variable_mcu_name: "eddy"                         # Matches the [mcu] section name above
variable_is_usb_or_can_version: True
variable_ldc_sensor_type: "ldc1612"               # For [probe_eddy_current]
variable_i2c_mcu_name: "eddy"                     # I2C is on the Eddy's own CAN controller
variable_i2c_bus: "i2c0f"                         # For [probe_eddy_current]
variable_x_offset: 0                              # For Klippain's [probe]
variable_y_offset: 21.42                          # For Klippain's [probe]
variable_raw_z_offset: 2.5                        # For [probe_eddy_current]
variable_mcu_temp_min: 10                         # For [temperature_sensor eddy_mcu_temp]
variable_mcu_temp_max: 100                        # For [temperature_sensor eddy_mcu_temp]
# These are informational for the [temperature_probe eddy_thermistor] above, not used by Jinja there anymore
variable_probe_thermistor_pin_info: "gpio26"      # Informational
variable_probe_thermistor_type_info: "Generic 3950" # Informational
variable_probe_temp_min_info: 10                  # Informational
variable_probe_temp_max_info: 100                 # Informational
# Variables for G-code macros
variable_travel_speed_xy: 150
variable_use_for_z_homing: True
variable_enable_eddy_custom_z_offset_macros: False
gcode:
    {% set dummy = 0 %}

# 4. Include the common Eddy probe logic and macros
[include eddy_virtual.cfg]