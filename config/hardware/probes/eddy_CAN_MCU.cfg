# Configuration for CAN-bus Eddy Probe
# This file sets up the MCU and specific variables for a CAN Eddy,
# then includes the common Eddy probe logic.

# 1. Define the CAN MCU for the Eddy Probe
[mcu eddy_controller_can] # <<< CHOOSE A UNIQUE NAME FOR THIS MCU
canbus_uuid: your_actual_canbus_uuid_here
canbus_interface: can0 # or your specific CAN interface
# restart_method: command

# 2. Define variables specific to this Eddy CAN probe setup
[gcode_macro _EDDY_PROBE_VARIABLES]
description: Variables for CAN Eddy Probe configuration.
variable_mcu_name: "eddy_controller_can"          # Matches the [mcu ...] name above
variable_is_usb_or_can_version: True
variable_ldc_sensor_type: "ldc1612"
variable_i2c_mcu_name: "eddy_controller_can"      # I2C is on the Eddy's own CAN controller
variable_i2c_bus: "i2c0f"                         # Adjust if different for your CAN Eddy
variable_x_offset: 0
variable_y_offset: 21.42
variable_raw_z_offset: 2.5
variable_mcu_temp_min: 10
variable_mcu_temp_max: 100
variable_probe_thermistor_pin: "gpio26"           # Pin on the 'eddy_controller_can' MCU
variable_probe_thermistor_type: "Generic 3950"
variable_probe_temp_min: 10
variable_probe_temp_max: 100
variable_travel_speed_xy: 150
variable_use_for_z_homing: True
variable_enable_eddy_custom_z_offset_macros: False
gcode:
    {% set dummy = 0 %}

# 3. Include the shared thermistor configuration for the Eddy's onboard thermistor
[include ../temperature_sensors/eddy_thermistor_temp.cfg]

# 4. Include the common Eddy probe logic and macros
[include eddy_virtual.cfg]