# Configuration for Eddy COIL Probe (using Toolboard/Mainboard MCU)
# This file sets up specific variables for an Eddy Coil,
# then includes the common Eddy probe logic.
#
# IMPORTANT: Ensure the MCU that the Eddy Coil's I2C lines are connected to
# (e.g., your toolboard MCU) is already defined in your main printer.cfg or mcu.cfg.

# 1. Define variables specific to this Eddy COIL probe setup
[gcode_macro _EDDY_PROBE_VARIABLES]
description: Variables for Eddy COIL Probe configuration.
# For COIL, 'mcu_name' isn't for a dedicated Eddy MCU, but can be the toolboard if needed for other logic.
# 'i2c_mcu_name' is critical and MUST be the name of the MCU handling the Coil's I2C.
variable_mcu_name: "my_toolboard_mcu"             # Example: Name of your toolboard MCU.
variable_is_usb_or_can_version: False
variable_ldc_sensor_type: "ldc1612"               # Or "ldc1614" if applicable
variable_i2c_mcu_name: "my_toolboard_mcu"         # <<< CRITICAL: Set to your toolboard/mainboard MCU name that Coil is wired to.
variable_i2c_bus: "i2c1a"                         # <<< CRITICAL: Check toolboard/mainboard docs for correct I2C bus.
variable_x_offset: 0
variable_y_offset: 21.42
variable_raw_z_offset: 2.5
variable_mcu_temp_min: 10
variable_mcu_temp_max: 100                        # For the i2c_mcu_name's temperature

# These are for the probe's own thermistor, which a COIL version doesn't have.
# Define them as "None" or sensible defaults to prevent errors if macros expect them.
variable_probe_thermistor_pin: "None"
variable_probe_thermistor_type: "None"
variable_probe_temp_min: 0
variable_probe_temp_max: 0

variable_travel_speed_xy: 150
variable_use_for_z_homing: True
variable_enable_eddy_custom_z_offset_macros: False
gcode:
    {% set dummy = 0 %}

# 2. For COIL version, we DO NOT include eddy_CAN-USB_thermistor.cfg
#    as there's no onboard thermistor on the Eddy COIL itself.
#    Temperature compensation for a COIL setup would typically rely on a
#    thermistor on the toolhead/toolboard, which should be defined elsewhere
#    (e.g., in your toolboard's config) and potentially used by Klipper's
#    general temperature compensation features if configured.

# 3. Include the common Eddy probe logic and macros
[include eddy_virtual.cfg]