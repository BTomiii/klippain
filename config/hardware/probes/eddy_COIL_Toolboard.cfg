# Configuration for Eddy COIL Probe (using Toolboard/Mainboard MCU)
#
# IMPORTANT: Ensure the MCU that the Eddy Coil's I2C lines are connected to
# (e.g., your toolboard MCU, referred to as 'i2c_mcu_name' below)
# is already defined in your main printer.cfg or mcu.cfg.

# 1. Define variables specific to this Eddy COIL probe setup
[gcode_macro _EDDY_PROBE_VARIABLES]
description: Variables for Eddy COIL Probe configuration.
variable_mcu_name: "my_toolboard_mcu"             # Name of the toolboard MCU (or main MCU if I2C is there)
variable_is_usb_or_can_version: False
variable_ldc_sensor_type: "ldc1612"               # For [probe_eddy_current]
variable_i2c_mcu_name: "my_toolboard_mcu"         # CRITICAL: Toolboard/mainboard MCU name for Coil's I2C
variable_i2c_bus: "i2c1a"                         # CRITICAL: I2C bus on that MCU for Coil
variable_x_offset: 0                              # For Klippain's [probe]
variable_y_offset: 21.42                          # For Klippain's [probe]
variable_raw_z_offset: 2.5                        # For [probe_eddy_current]
variable_mcu_temp_min: 10                         # For [temperature_sensor eddy_mcu_temp] (temp of i2c_mcu_name)
variable_mcu_temp_max: 100                        # For [temperature_sensor eddy_mcu_temp]
# Probe thermistor not applicable for COIL version directly on the probe
variable_probe_thermistor_pin_info: "None"
variable_probe_thermistor_type_info: "None"
variable_probe_temp_min_info: 0
variable_probe_temp_max_info: 0
# Variables for G-code macros
variable_travel_speed_xy: 150
variable_use_for_z_homing: True
variable_enable_eddy_custom_z_offset_macros: False
gcode:
    {% set dummy = 0 %}

# 2. Include the common Eddy probe logic and macros
[include eddy_virtual.cfg]